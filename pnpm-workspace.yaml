# Keep one lockfile document so GitHub can read the dependency graph.
# Corepack still enforces packageManager.
# pnpm 12 writes a second document unless pmOnFail equals ignore.
pmOnFail: ignore

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

# Pin every undici 7 release to 7.30.0. This keeps undici 8.10.2.
overrides:
  "undici@7": 7.30.0

allowBuilds:
  esbuild: true
  # wrangler pulls sharp and workerd, and both run install scripts.
  sharp: true
  workerd: true
