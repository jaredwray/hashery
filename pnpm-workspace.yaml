# Keep one lockfile document so GitHub can read the dependency graph.
# Corepack still enforces packageManager.
# pnpm 12 writes a second document unless pmOnFail equals ignore.
pmOnFail: ignore

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

# miniflare requests undici 7.29.1. The 7.x override replaces that request.
# Parent ranges do not force the other patched versions.
overrides:
  # CVE-2026-87018, CVE-2026-109869, and CVE-2026-109383 have a fix in undici 7.30.1.
  "undici@7": "7.30.1"
  # CVE-2026-109829 has a fix in undici 8.12.2. docula accepts undici ^8.10.2.
  "undici@8": ">=8.12.2 <9"
  # CVE-2026-111758 and CVE-2026-111759 have a fix in markdown-it 15.0.3.
  "markdown-it@15": "15.0.3"
  # CVE-2023-54404 has a fix in zod 4.6.7. writr accepts zod ^4.4.3.
  "zod@4": "4.6.7"

allowBuilds:
  esbuild: true
  # wrangler pulls sharp and workerd, and both run install scripts.
  sharp: true
  workerd: true
