# Keep one lockfile document so GitHub's dependency graph can read it.
# Corepack still enforces packageManager. pnpm 12 records its own binary
# in a leading document unless this is ignore.
pmOnFail: ignore

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  # wrangler pulls sharp and workerd, and both run install scripts.
  sharp: true
  workerd: true
